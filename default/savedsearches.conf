# Ready-made searches. None is scheduled and none has an alert action:
# enable or clone the ones you want.

[Hexward - Open critical and high findings]
description = Findings whose latest event is not "resolved", critical or high, one row per fingerprint.
dispatch.earliest_time = -30d
dispatch.latest_time = now
search = eventtype=hexward_finding \
| stats latest(event) AS last_event latest(severity) AS severity latest(signature) AS title latest(dest) AS target latest(product) AS product latest(description) AS remediation latest(_time) AS last_seen BY id \
| where last_event!="resolved" AND (severity="critical" OR severity="high") \
| eval last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
| sort severity product target \
| fields - last_event

[Hexward - New findings in the last 24 hours]
description = Every finding opened in the last 24 hours.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = eventtype=hexward_finding_opened \
| table _time product severity signature dest description src

[Hexward - Mean time to resolve by product]
description = Average hours between "opened" and "resolved" for findings that closed.
dispatch.earliest_time = -90d
dispatch.latest_time = now
search = eventtype=hexward_finding (event="opened" OR event="resolved") \
| stats min(eval(if(event="opened", _time, null()))) AS opened max(eval(if(event="resolved", _time, null()))) AS resolved BY product id \
| where isnotnull(opened) AND isnotnull(resolved) AND resolved>=opened \
| eval hours=round((resolved-opened)/3600, 1) \
| stats count AS resolved_findings avg(hours) AS avg_hours_to_resolve BY product \
| eval avg_hours_to_resolve=round(avg_hours_to_resolve, 1)
