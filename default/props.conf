# Hexward Finding Schema v1 (hexward.finding/1)
# https://github.com/nizartuanku/hexward-core/blob/main/SCHEMA.md
#
# Arrives three ways, all with sourcetype hexward:finding:
#   - HTTP Event Collector: the product sets the sourcetype itself.
#   - Universal Forwarder monitoring /var/log/hexward/*.ndjson (see README).
#   - Syslog in HFS JSON: route the syslog input to this sourcetype.

[hexward:finding]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000
TIME_PREFIX = "ts":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 25
KV_MODE = json
category = Structured
description = Hexward Labs finding (Hexward Finding Schema v1)

# CIM (Alerts data model) field names
FIELDALIAS-hexward_dest         = finding.target AS dest
FIELDALIAS-hexward_signature    = finding.title AS signature
FIELDALIAS-hexward_signature_id = finding.check AS signature_id
FIELDALIAS-hexward_id           = finding.fingerprint AS id
FIELDALIAS-hexward_src          = src_ip AS src
EVAL-severity       = if('finding.severity'=="info", "informational", 'finding.severity')
EVAL-description    = 'finding.remediation'
EVAL-app            = product
EVAL-vendor_product = "Hexward Labs " . product
EVAL-type           = "alert"
